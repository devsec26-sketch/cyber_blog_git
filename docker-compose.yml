version: '3.8'

services:
  # Laravel Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www
    depends_on:
      - db

  # MySQL Database Service
  db:
    image: mysql:8.0
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: laravel_testing
      MYSQL_ROOT_PASSWORD: root_password_here
      MYSQL_USER: mido
      MYSQL_PASSWORD: mido_password_here
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
